<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Laboratório de objetos 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { color: #f4bd44; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .object-picker {
      position: fixed;
      z-index: 2;
      top: 24px;
      left: 24px;
      display: grid;
      gap: 8px;
      width: min(280px, calc(100vw - 48px));
      padding: 15px;
      border: 1px solid #ffb00055;
      background: #080603d9;
      box-shadow: 0 12px 42px #000;
      backdrop-filter: blur(10px);
    }
    label { color: #ffb00099; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
    select {
      width: 100%;
      padding: 9px 35px 9px 10px;
      color: #ffd36d;
      font: inherit;
      font-size: 13px;
      border: 1px solid #ffb00066;
      border-radius: 0;
      background: #000;
      outline: none;
    }
    select:focus-visible { border-color: #ffd36d; box-shadow: 0 0 0 2px #ffb00033; }
    p { min-height: 2.8em; margin: 2px 0 0; color: #b78b39; font-size: 10px; line-height: 1.45; }
  </style>
</head>
<body>
  <aside class="object-picker" aria-label="Seleção do objeto 3D">
    <label for="object-select">Objeto em exibição</label>
    <select id="object-select">
      <option value="pillar">Pilar de partículas</option>
      <option value="sun">Sol 3D</option>
    </select>
    <p id="object-description"></p>
  </aside>
  <canvas id="object" tabindex="0" aria-label="Visualização do objeto 3D selecionado"></canvas>
  <script type="module" src="/js/pillar-lab.js"></script>
</body>
</html>
